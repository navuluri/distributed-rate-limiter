# Application Configuration
spring.application.name=rate-limiter-backend

# Server Configuration
server.port=8080

# Redis Configuration
# For local development, use: localhost
# For production, override with environment variables
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=60000

# JWT Configuration
# Private & Public Key Configuration for JWT signing and verification
jwt.private.key=classpath:private.key
jwt.public.key=classpath:public.key
# Token expiry: 1 day in seconds (86400 seconds = 24 hours)
jwt.token.expiry.seconds=86400

# Logging Configuration
logging.level.com.distributed.rate.limiter=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
